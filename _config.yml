  - data/
  - fulltext/
  - node_modules/
  - pagefind/
  - scripts/
  - README.md
  - todo.md
  - image_catalog.json
  - suggest_queue.csv
  - vendor/
  - workers/
  - Gemfile
  - Gemfile.lock
  - "*.pyc"
  - __pycache__/
