title: "הנגשת מידע בנושאי דמוקרטיה"
description: "תמציות מאמרים אקדמיים של חוקרות וחוקרים ישראלים בנושאי דמוקרטיה ליברלית, זכויות, מוסדות ושלטון החוק."
url: "https://demokratia-info.github.io"
baseurl: ""
lang: he
direction: rtl
timezone: Asia/Jerusalem

collections:
  papers:
    output: true
    permalink: /:name.html

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper

exclude:
  - .github/
  - .npm-cache/
  - AGENTS.md
  - Authors.MD
  - AUTOMATION_PROMPT.md
  - data/
  - HANDOFF.md
  - node_modules/
  - pagefind/
  - scripts/
  - README.md
  - todo.md
  - image_catalog.json
  - suggest_queue.csv
  - workers/
  - Gemfile
  - Gemfile.lock
  - "*.pyc"
  - __pycache__/
