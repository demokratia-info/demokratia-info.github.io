title: "הנגשת מידע בנושאי דמוקרטיה"
description: "תקצירי מאמרים אקדמיים של חוקרות וחוקרים ישראלים בנושאי דמוקרטיה ליברלית, זכויות, מוסדות ושלטון החוק."
url: "https://democracy.tau.ac.il"
baseurl: ""
home_url: "https://democracy.tau.ac.il/index.html"
lang: he
direction: rtl
timezone: Asia/Jerusalem

collections:
