{% assign form_origin = site.data.site.formOrigin | default: '' %}
{% if form_origin %}
<script>
(() => {
  const formOrigin = {{ form_origin | jsonify }};
  if (!formOrigin || window.location.origin === formOrigin) return;
  const nextUrl = new URL(window.location.href);
  nextUrl.protocol = new URL(formOrigin).protocol;
  nextUrl.host = new URL(formOrigin).host;
  window.location.replace(nextUrl.toString());
})();
</script>
{% endif %}
